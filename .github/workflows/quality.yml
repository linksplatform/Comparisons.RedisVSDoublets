name: CI quality

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/**', 'scripts/**', 'pyproject.toml', '*.md', 'experiments/**/*.md', '.markdownlint.json', '.secretlintrc.json', '.pre-commit-config.yaml']
  pull_request:
    paths: ['.github/**', 'scripts/**', 'pyproject.toml', '*.md', 'experiments/**/*.md', '.markdownlint.json', '.secretlintrc.json', '.pre-commit-config.yaml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Actionlint and ShellCheck
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15'
      - run: python -m pip install -r scripts/requirements-ci.txt
      - name: Workflow security
        run: |
          zizmor --offline --min-severity medium .github
          zizmor --offline --persona pedantic --min-severity high --min-confidence high .github

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15'
      - run: python -m pip install -r scripts/requirements.txt -r scripts/requirements-ci.txt
      - run: ruff check scripts
      - run: ruff format --check scripts
      - run: mypy scripts
      - run: bandit -r scripts -q
      - run: python -m unittest discover -s scripts -v

  markdown:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: npx --yes markdownlint-cli@0.49.1 README.md README.ru.md CONTRIBUTING.md experiments/README.md

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Scan maintained source for secrets
        run: git ls-files -z -- ':!*.png' | xargs -0 npx --yes -p secretlint@13.0.7 -p @secretlint/secretlint-rule-preset-recommend@13.0.7 secretlint
