name: CI quality

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/**', 'scripts/**', 'pyproject.toml', '*.md', 'experiments/**/*.md', '.markdownlint.json']
  pull_request:
    paths: ['.github/**', 'scripts/**', 'pyproject.toml', '*.md', 'experiments/**/*.md', '.markdownlint.json']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Actionlint and ShellCheck
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r scripts/requirements-ci.txt
      - name: Workflow security
        run: |
          zizmor --offline --min-severity medium .github
          zizmor --offline --persona pedantic --min-severity high --min-confidence high .github

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r scripts/requirements.txt -r scripts/requirements-ci.txt
      - run: ruff check scripts
      - run: ruff format --check scripts
      - run: mypy scripts
      - run: bandit -r scripts -q
      - run: python -m unittest discover -s scripts -v

  markdown:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: npx --yes markdownlint-cli@0.49.1 README.md experiments/README.md
