version: 2
updates:
- package-ecosystem: nuget
  directories:
    - "/csharp"
    - "/experiments/csharp-external-references"
    - "/experiments/csharp-usage-index-trees"
  schedule:
    interval: daily
  open-pull-requests-limit: 10
  cooldown:
    default-days: 7
- package-ecosystem: cargo
  directories:
    - "/rust"
    - "/experiments/rust-external-references"
  schedule:
    interval: daily
  open-pull-requests-limit: 10
  cooldown:
    default-days: 7
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
- package-ecosystem: pip
  directory: "/scripts"
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
