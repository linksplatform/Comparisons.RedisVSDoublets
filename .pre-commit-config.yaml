repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^scripts/.*\.py$
      - id: ruff-format
        files: ^scripts/.*\.py$
  - repo: local
    hooks:
      - id: rustfmt
        name: Rust formatting
        entry: cargo fmt --manifest-path rust/Cargo.toml --check
        language: system
        files: ^rust/.*\.rs$
        pass_filenames: false
      - id: rustfmt-experiments
        name: Rust experiment formatting
        entry: bash -c 'for manifest in experiments/rust-*/Cargo.toml; do cargo fmt --manifest-path "$manifest" --check || exit 1; done'
        language: system
        files: ^experiments/rust-.*\.rs$
        pass_filenames: false
      - id: dotnet-format
        name: C# whitespace formatting
        entry: dotnet format whitespace csharp/RedisVSDoublets.slnx --verify-no-changes
        language: system
        files: ^csharp/.*\.cs$
        pass_filenames: false
