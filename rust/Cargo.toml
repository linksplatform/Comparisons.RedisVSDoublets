[package]
name = "redis-vs-doublets"
version = "0.1.0"
edition = "2024"
license = "Unlicense"
description = "Compares Redis and Doublets as storage for links and for typical Redis data structures"
publish = false

[[bench]]
name = "bench"
harness = false

[dependencies]
doublets = "0.8.0"
# The synchronous client of redis-rs: every operation waits for its reply, as
# the operations of the doublets stores do. Only the commands are needed.
redis = { version = "1.8.0", default-features = false }

[dev-dependencies]
criterion = "0.8.2"

[profile.release]
lto = true
codegen-units = 1

[profile.bench]
lto = true
codegen-units = 1
